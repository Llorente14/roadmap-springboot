<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Onboarding Stage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Chakra+Petch:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --void: #000; --ink: #0d0d0d; --ink-raised: #161616; --hairline: #262626; --hairline-strong: #3a3a3a;
  --bone: #fff; --ash: #9a9a9a; --silver: #bdbdbd; --ego-red: #cc1510; --signal-red: #ee2b20; --blood: #7a0a0e;
  --ok: #3ccf6e; --warn: #e8b13a;
  --font-display: "Anton", sans-serif; --font-body: "Chakra Petch", sans-serif; --font-mono: "JetBrains Mono", monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--void); color: var(--bone); font: 400 24px/1.5 var(--font-body); }
#stage { position: relative; width: 1920px; height: 1080px; overflow: hidden;
  background: radial-gradient(1200px 600px at 85% -10%, rgba(204,21,16,.10), transparent 60%), var(--void); }

/* top bar */
.top { position: absolute; left: 120px; right: 120px; top: 40px; height: 48px; display: flex; align-items: center; justify-content: space-between; }
.brand { display: flex; align-items: center; gap: 14px; font: 600 20px/1 var(--font-body); letter-spacing: .14em; text-transform: uppercase; color: var(--silver); }
.brand svg { width: 34px; height: 34px; }
.chip { display: flex; align-items: baseline; gap: 16px; }
.chip b { font: 400 30px/1 var(--font-display); color: var(--signal-red); letter-spacing: .04em; }
.chip span { font: 400 30px/1 var(--font-display); letter-spacing: .05em; text-transform: uppercase; }
.prog { position: absolute; left: 0; right: 0; top: 0; height: 6px; background: var(--ink-raised); }
.prog i { display: block; height: 100%; width: 0; background: var(--ego-red); }

/* window */
.win { position: absolute; left: 120px; top: 116px; width: 1680px; height: 770px; background: var(--ink); border: 1px solid var(--hairline-strong); border-radius: 14px; overflow: hidden; box-shadow: 0 30px 80px rgba(0,0,0,.6); }
.win-bar { height: 50px; display: flex; align-items: center; gap: 16px; padding: 0 20px; border-bottom: 1px solid var(--hairline); background: var(--ink-raised); font: 500 19px/1 var(--font-mono); color: var(--ash); }
.win-bar .dots { display: flex; gap: 9px; } .win-bar .dots i { width: 13px; height: 13px; border-radius: 50%; background: var(--hairline-strong); }
.win-bar .addr { flex: 1; height: 32px; border-radius: 8px; background: var(--ink); border: 1px solid var(--hairline); display: flex; align-items: center; padding: 0 14px; color: var(--silver); }
.win-body { position: absolute; top: 50px; left: 0; right: 0; bottom: 0; }

/* terminal */
.term { padding: 26px 34px; font: 400 25px/1.55 var(--font-mono); color: var(--silver); display: flex; flex-direction: column; justify-content: flex-end; height: 100%; white-space: pre; overflow: hidden; }
.term .ps { color: var(--ash); } .term .cmd { color: var(--bone); }
.term .err { color: #ff5a4f; } .term .ok { color: var(--ok); } .term .dim { color: #6f6f6f; } .term .warn { color: var(--warn); } .term .info { color: #7fb4ff; }
.caret { display: inline-block; width: 13px; height: 28px; background: var(--bone); vertical-align: -5px; margin-left: 2px; }
mark { background: rgba(238,43,32,.22); color: inherit; outline: 3px solid var(--signal-red); outline-offset: 2px; border-radius: 3px; }

/* ide */
.ide { display: grid; grid-template-columns: 470px 1fr; height: 100%; }
.tree { border-right: 1px solid var(--hairline); padding: 18px 0; font: 400 21px/1 var(--font-mono); color: var(--silver); }
.tree .it { display: flex; align-items: center; gap: 10px; height: 40px; padding-right: 14px; white-space: nowrap; }
.tree .it.dir { color: var(--bone); }
.tree .it.on { background: rgba(204,21,16,.16); box-shadow: inset 3px 0 0 var(--signal-red); color: var(--bone); }
.tree .tag { margin-left: auto; font: 600 15px/1 var(--font-body); letter-spacing: .06em; text-transform: uppercase; padding: 6px 9px; border-radius: 5px; background: var(--ego-red); color: var(--bone); }
.tree .tag.gray { background: var(--hairline-strong); color: var(--silver); }
.ed { display: flex; flex-direction: column; min-width: 0; }
.tabs { height: 46px; display: flex; border-bottom: 1px solid var(--hairline); }
.tabs .t { padding: 0 22px; display: flex; align-items: center; gap: 10px; font: 400 19px/1 var(--font-mono); color: var(--ash); border-right: 1px solid var(--hairline); }
.tabs .t.on { color: var(--bone); background: var(--ink-raised); box-shadow: inset 0 -2px 0 var(--signal-red); }
.tabs .ro { font: 600 14px/1 var(--font-body); text-transform: uppercase; letter-spacing: .06em; color: var(--warn); border: 1px solid var(--warn); padding: 4px 7px; border-radius: 4px; }
.code { padding: 18px 0; font: 400 22px/1.6 var(--font-mono); white-space: pre; overflow: hidden; }
.code .ln { display: flex; } .code .ln.on { background: rgba(204,21,16,.18); box-shadow: inset 4px 0 0 var(--signal-red); }
.code .no { width: 70px; padding-right: 22px; text-align: right; color: #555; flex: none; }
.k { color: #ff7b72; } .s { color: #a5d6ff; } .c { color: #7d8590; font-style: italic; } .a { color: #d2a8ff; } .n { color: #79c0ff; }

/* browser */
.win.browser iframe { position: absolute; top: 50px; left: 0; width: 1680px; height: 720px; border: 0; background: var(--void); }

/* github mock */
.gh { padding: 40px 60px; font: 400 22px/1.5 var(--font-body); color: #e6edf3; background: #0d1117; height: 100%; position: relative; }
.gh h2 { font: 500 30px/1.2 var(--font-body); display: flex; align-items: center; gap: 14px; }
.gh h2 .own { color: #4493f8; } .gh .pill { font: 500 16px/1 var(--font-body); border: 1px solid #3d444d; color: #9198a1; padding: 6px 12px; border-radius: 99px; }
.gh .row { display: flex; align-items: center; gap: 14px; margin: 30px 0 22px; }
.gh .btn { font: 600 20px/1 var(--font-body); padding: 14px 22px; border-radius: 8px; border: 1px solid #3d444d; background: #212830; color: #e6edf3; display: inline-flex; gap: 10px; align-items: center; }
.gh .btn.green { background: #238636; border-color: #2ea043; }
.gh .files { border: 1px solid #3d444d; border-radius: 8px; }
.gh .files div { padding: 13px 20px; border-top: 1px solid #3d444d; font: 400 20px/1 var(--font-mono); color: #c9d1d9; }
.gh .files div:first-child { border-top: 0; background: #151b23; font-family: var(--font-body); color: #9198a1; }
.gh .menu { position: absolute; width: 420px; background: #151b23; border: 1px solid #3d444d; border-radius: 10px; box-shadow: 0 16px 40px rgba(0,0,0,.5); overflow: hidden; }
.gh .menu div { padding: 18px 22px; font: 500 21px/1 var(--font-body); } .gh .menu div.hot { background: #1f6feb; }
.gh label { display: block; font: 600 20px/1 var(--font-body); margin: 28px 0 12px; }
.gh .inp { height: 54px; border: 1px solid #3d444d; border-radius: 8px; background: #0d1117; display: flex; align-items: center; padding: 0 16px; font: 400 22px/1 var(--font-mono); min-width: 560px; }
.gh .inp.focus { border-color: #1f6feb; box-shadow: 0 0 0 3px rgba(31,111,235,.35); }
.gh .radio { display: flex; gap: 40px; margin-top: 10px; font-size: 21px; }
.gh .radio span::before { content: ""; display: inline-block; width: 18px; height: 18px; border-radius: 50%; border: 2px solid #9198a1; margin-right: 10px; vertical-align: -2px; }
.gh .radio span.on::before { border: 6px solid #1f6feb; }
.gh .note { color: #9198a1; font-size: 19px; margin-top: 12px; }

/* title card */
.title { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; padding-left: 220px; }
.title .big { font: 400 300px/.85 var(--font-display); color: var(--signal-red); letter-spacing: .01em; }
.title h1 { font: 400 120px/1 var(--font-display); text-transform: uppercase; letter-spacing: .02em; margin-top: 30px; }
.title p { font: 500 34px/1.4 var(--font-body); color: var(--silver); margin-top: 26px; letter-spacing: .02em; }
.title .rule { height: 6px; background: var(--ego-red); margin-top: 40px; }

/* caption */
.cap { position: absolute; left: 120px; right: 120px; top: 918px; height: 120px; display: flex; align-items: center; gap: 26px; }
.cap .bar { width: 6px; align-self: stretch; background: var(--ego-red); flex: none; }
.cap p { font: 500 38px/1.3 var(--font-body); letter-spacing: .005em; }
.cap code { font: 500 33px/1 var(--font-mono); color: var(--bone); background: var(--ink-raised); border: 1px solid var(--hairline-strong); padding: 3px 10px; border-radius: 6px; }
.cap b { color: var(--signal-red); font-weight: 600; }

/* overlays */
#hls { position: absolute; left: 120px; top: 116px; width: 1680px; height: 770px; border-radius: 14px; overflow: hidden; pointer-events: none; }
.hl { position: absolute; border: 4px solid var(--signal-red); border-radius: 10px; box-shadow: 0 0 0 9999px rgba(0,0,0,.45); }
.hl .lbl { position: absolute; left: -4px; top: -48px; font: 600 20px/1 var(--font-body); letter-spacing: .06em; text-transform: uppercase; background: var(--signal-red); color: var(--bone); padding: 10px 14px; border-radius: 6px 6px 6px 0; white-space: nowrap; }
#cursor { position: absolute; left: 0; top: 0; width: 36px; height: 36px; pointer-events: none; z-index: 10; }
#cursor svg { width: 36px; height: 36px; filter: drop-shadow(0 3px 6px rgba(0,0,0,.6)); }
#ring { position: absolute; width: 70px; height: 70px; margin: -35px 0 0 -35px; border-radius: 50%; border: 4px solid var(--signal-red); pointer-events: none; z-index: 9; opacity: 0; }
</style>
</head>
<body>
<div id="stage">
  <div class="prog"><i id="progFill"></i></div>
  <div class="top">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2 29 8v9c0 6.5-5.4 11.3-13 13C8.4 28.3 3 23.5 3 17V8l13-6Z" fill="#cc1510"/><path d="M9.5 14.5c1.6-1.4 3.5-1.4 5 0M17.5 14.5c1.6-1.4 3.5-1.4 5 0M11 21c3 2 7 2 10 0" stroke="#000" stroke-width="2.2" fill="none" stroke-linecap="round"/></svg>
      AlterEgo API · Quest Board
    </div>
    <div class="chip"><b id="clipNo"></b><span id="clipName"></span></div>
  </div>
  <div id="scene"></div>
  <div class="win browser" id="browser" hidden>
    <div class="win-bar"><div class="dots"><i></i><i></i><i></i></div><div class="addr" id="addr"></div></div>
    <iframe id="board" title="Quest board"></iframe>
  </div>
  <div id="hls"></div>
  <div class="cap" id="cap"><span class="bar"></span><p id="capText"></p></div>
  <div id="ring"></div>
  <div id="cursor" hidden><svg viewBox="0 0 24 24"><path d="M4 2.5v17.2l4.6-4.2 3 6.8 3.1-1.4-3-6.6 6.3-.4L4 2.5Z" fill="#fff" stroke="#000" stroke-width="1.4" stroke-linejoin="round"/></svg></div>
</div>
<script src="clips.js"></script>
<script src="engine.js"></script>
</body>
</html>
